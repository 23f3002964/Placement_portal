{% extends 'base.html' %}

{% block title %}Register as Company{% endblock %}

{% block content %}
<div class="row mt-5">
  <div class="col-md-6 offset-md-3">
    <h2 class="text-center">Company Registration</h2>
    <div class="card mt-4">
      <div class="card-body">
        <form method="POST" action="{{ url_for('auth.register_company') }}">
          <div class="mb-3">
            <label class="form-label" for="username">Username (for login) *</label>
            <input type="text" class="form-control" id="username" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email address *</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password *</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="company_name">Company Name *</label>
            <input type="text" class="form-control" id="company_name" name="company_name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="hr_contact">HR Contact Name</label>
            <input type="text" class="form-control" id="hr_contact" name="hr_contact">
          </div>
          <div class="mb-3">
            <label class="form-label" for="website">Company Website</label>
            <input type="url" class="form-control" id="website" name="website">
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Register</button>
          </div>
        </form>
      </div>
      <div class="card-footer text-center">
        <small>Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
