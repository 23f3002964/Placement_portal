{% extends 'base.html' %}

{% block title %}Register as Student{% endblock %}

{% block content %}
<div class="row mt-5">
  <div class="col-md-6 offset-md-3">
    <h2 class="text-center">Student Registration</h2>
    <div class="card mt-4">
      <div class="card-body">
        <form method="POST" action="{{ url_for('auth.register_student') }}">
          <div class="mb-3">
            <label class="form-label" for="username">Username *</label>
            <input type="text" class="form-control" id="username" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email address *</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password *</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="branch">Branch (optional)</label>
            <input type="text" class="form-control" id="branch" name="branch">
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Register</button>
          </div>
        </form>
      </div>
      <div class="card-footer text-center">
        <small>Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
