{% macro stat_card(title, value, icon, color='primary', subtitle='') %}
<div class="card border-0 shadow-sm h-100">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <p class="text-muted small mb-1">{{ title }}</p>
                <h3 class="mb-0">{{ value }}</h3>
                {% if subtitle %}
                <p class="small text-muted mb-0">{{ subtitle }}</p>
                {% endif %}
            </div>
            <div class="bg-{{ color }} text-white p-3 rounded-circle shadow-sm d-flex align-items-center justify-content-center"
                style="width: 50px; height: 50px;">
                <i class="bi bi-{{ icon }} fs-4"></i>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
