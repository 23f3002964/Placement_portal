{% extends 'base.html' %}

{% block title %}Registration Options{% endblock %}

{% block content %}
<div class="row mt-5">
  <div class="col-md-6 offset-md-3 text-center">
    <h2>Register</h2>
    <p>Choose your account type to proceed with registration.</p>
    <div class="mt-4">
      <a href="{{ url_for('auth.register_student') }}" class="btn btn-primary d-block mb-3">Register as Student</a>
      <a href="{{ url_for('auth.register_company') }}" class="btn btn-secondary d-block">Register as Company</a>
    </div>
  </div>
</div>
{% endblock %}
