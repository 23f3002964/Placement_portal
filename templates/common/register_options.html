{% extends 'base.html' %}

{% block title %}Register - PlacementHub{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h2 class="mb-3">Create an Account</h2>
        <p class="text-muted">Choose the type of account you want to create.</p>

        <div class="d-grid gap-2">
          <a href="{{ url_for('auth.register_student') }}" class="btn btn-primary btn-lg">I'm a Student</a>
          <a href="{{ url_for('auth.register_company') }}" class="btn btn-outline-primary btn-lg">I'm a Company</a>
          <a href="{{ url_for('common.home') }}" class="btn btn-link">Back to Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
