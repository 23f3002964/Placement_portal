{% extends 'base.html' %}

{% block title %}Search{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2>Search Results</h2>
        <hr>
    </div>
</div>

<div class="row mt-3">
    <div class="col-md-6 mb-3">
        <form class="d-flex" action="{{ url_for('common.search') }}" method="GET">
            <input class="form-control me-2" type="search" name="q" placeholder="Enter search term...">
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="alert alert-secondary">
            Use the search bar above to find students, companies, or placement drives.
        </div>
    </div>
</div>
{% endblock %}
