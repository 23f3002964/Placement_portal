{% extends 'base.html' %}

{% block title %}Edit Student Profile{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-6 offset-md-3">
        <h2 class="text-center">My Profile</h2>
        <div class="card mt-4">
            <div class="card-body">
                <form action="{{ url_for('student.profile') }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username (Read-only)</label>
                        <input type="text" class="form-control" id="username" value="{{ current_user.username }}"
                            disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email (Read-only)</label>
                        <input type="email" class="form-control" id="email" value="{{ current_user.email }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="branch">Branch</label>
                        <input type="text" class="form-control" id="branch" name="branch"
                            value="{{ profile.branch or '' }}" placeholder="e.g. Computer Science">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="cgpa">CGPA</label>
                        <input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa"
                            value="{{ profile.cgpa or '' }}" placeholder="8.50">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="resume">Upload Resume (PDF)</label>
                        <input type="file" class="form-control" id="resume" name="resume" accept=".pdf">
                        {% if profile.resume_path %}
                        <small class="text-success d-block mt-1">Status: Resume uploaded.</small>
                        {% else %}
                        <small class="text-danger d-block mt-1">Status: No resume uploaded yet.</small>
                        {% endif %}
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Save Profile</button>
                        <a href="{{ url_for('student.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
